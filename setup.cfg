[metadata]
name = garment-waterproof-analysis
version = 0.1.0
description = Reproducible visual and functional rain-jacket analysis

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    pandas>=1.5
    numpy>=1.24
    scikit-learn>=1.2
    scipy>=1.11
    matplotlib>=3.6
    openpyxl>=3.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    garment-analysis = garment_analysis.run:main
